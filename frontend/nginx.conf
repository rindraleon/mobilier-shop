server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------------
    # Sécurité (§54) — en-têtes mutualisés + Content-Security-Policy.
    # Voir security-headers.conf pour le détail et le piège d'héritage nginx.
    # ---------------------------------------------------------------------
    include /etc/nginx/security-headers.conf;

    # ---------------------------------------------------------------------
    # API : même origine que le site → aucun cookie cross-origin (§50)
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads (images produits, pièces justificatives…)
        client_max_body_size 10m;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------------
    # Actifs statiques : cache long (les noms de fichiers sont hashés)
    # ---------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------
    # Application : toutes les routes sont rendues par l'SPA
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit jamais être mis en cache (déploiements).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
    }
}
