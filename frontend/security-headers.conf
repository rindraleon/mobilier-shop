# -----------------------------------------------------------------------------
# En-têtes de sécurité — à inclure dans CHAQUE bloc qui définit son propre
# `add_header`.
#
# ⚠ Piège nginx : dans un bloc `location`, la présence d'un seul `add_header`
# annule **tous** les en-têtes hérités du bloc parent. Ce fichier est donc
# inclus au niveau `server` **et** dans chaque `location` qui ajoute un en-tête
# (ici `/assets/` et `= /index.html`), sinon ces réponses partiraient sans
# protection.
# -----------------------------------------------------------------------------

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# -----------------------------------------------------------------------------
# Content-Security-Policy
#
# Deuxième rempart contre l'injection de contenu : même si du script parvenait
# à entrer dans une page, il ne s'exécuterait pas.
#
#  - `style-src` accepte 'unsafe-inline' car React écrit des styles en attribut
#    `style`, et Google Fonts fournit une feuille de style tierce.
#  - `img-src` accepte `https:` pour les URL présignées MinIO. Si MinIO est
#    exposé en HTTP sur une autre origine, ajouter cette origine ici
#    (par ex. `http://minio:9000`) plutôt que d'assouplir la règle.
#  - Aucun 'unsafe-eval' : le bundle de production n'en a pas besoin.
# -----------------------------------------------------------------------------
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

# HSTS : volontairement absent. La terminaison TLS se fait en général en amont
# (reverse proxy, ingress). L'activer ici forcerait le HTTPS même derrière un
# déploiement de test en HTTP brut, ce qui le rendrait inaccessible. À activer
# une fois le HTTPS garanti de bout en bout :
# add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
